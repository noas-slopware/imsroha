# LG U+ the way b2q-imsd registered it on the Galaxy Z Flip3 (2026-11): no
# IPsec, none of TTAK.KO-06.0357's additions, TTA-VoLTE/1.0 with LUC. The
# golden test checks these settings still send exactly what b2q-imsd sent.
# Copied into /etc/imsroha/imsroha.conf it brings that behaviour back.
[device]
model=SM-F711N
build=b2q-imsd-0.1
operator=LGU

[carrier]
user-agent=TTA-VoLTE/1.0 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/Android_Phone LUC
ipsec=false
tta=false
pt-amr-wb-be=0
pt-amr-be=0
reg-event=false
sip-instance=false
