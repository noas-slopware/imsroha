<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- imsroha-rcs (root) owns codes.noa.IMSroha.Rcs. The messaging app
       (Spacebar's daemon, in the user's session) talks to it directly:
       there is no ModemManager in between for RCS. Like ModemManager's
       Messaging interface for an active local user, any local user may send;
       on a phone that is the phone's owner. -->
  <policy user="root">
    <allow own="codes.noa.IMSroha.Rcs"/>
    <allow send_destination="codes.noa.IMSroha.Rcs"/>
  </policy>
  <policy context="default">
    <allow send_destination="codes.noa.IMSroha.Rcs" send_interface="codes.noa.IMSroha.Rcs"/>
    <allow send_destination="codes.noa.IMSroha.Rcs" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="codes.noa.IMSroha.Rcs" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
