[Unit]
# Voice and messaging are delegated to imsroha. ModemManager decides to export
# them from the ID_MM_IMSROHA udev tag, and its IMSroha backend watches the
# codes.noa.IMSroha bus name, so imsroha may appear at any time after ModemManager.
#
# No ordering against the IMS units: the bearer cannot bind its mux port until
# ModemManager has configured the data port, so ordering ModemManager after
# imsroha (which waits for the bearer) would hold ModemManager back for good.
Wants=imsroha-bearer.service
