<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- imsroha sends SMS and places calls on the SIM, and hands out received
       messages. Only root (ModemManager, which applications go through) may
       talk to it. Signals still reach ModemManager, which runs as root. -->
  <policy user="root">
    <allow own="codes.noa.IMSroha"/>
    <allow send_destination="codes.noa.IMSroha"/>
    <allow receive_interface="codes.noa.IMSroha" receive_member="PduReceived"/>
    <allow receive_interface="codes.noa.IMSroha" receive_member="PortPduReceived"/>
  </policy>
  <!-- The received messages themselves (an RCS OTP among them) are broadcast
       signals: only root (ModemManager, imsroha-rcs) gets them. The call and
       registration signals stay readable for everyone. -->
  <policy context="default">
    <deny send_destination="codes.noa.IMSroha"/>
    <deny receive_interface="codes.noa.IMSroha" receive_member="PduReceived"/>
    <deny receive_interface="codes.noa.IMSroha" receive_member="PortPduReceived"/>
  </policy>
</busconfig>
