<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- imsroha sends SMS and places calls on the SIM, and hands out received
       messages. Only root (ModemManager, which applications go through) may
       talk to it. Signals still reach ModemManager, which runs as root. -->
  <policy user="root">
    <allow own="codes.noa.IMSroha"/>
    <allow send_destination="codes.noa.IMSroha"/>
  </policy>
  <policy context="default">
    <deny send_destination="codes.noa.IMSroha"/>
  </policy>
</busconfig>
