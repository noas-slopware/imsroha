# SPDX-License-Identifier: GPL-3.0-only
#
# Carrier profiles. imsroha picks the group whose plmn= list holds the SIM's
# MCC+MNC (from EF_IMSI and EF_AD). Anything here can be overridden on one
# machine in /etc/imsroha/imsroha.conf, group [carrier].
#
# Keys (all optional; a missing key keeps the 3GPP default):
#   domain           home domain when the SIM has no ISIM (an ISIM's EF_DOMAIN wins)
#   pcscf            P-CSCFs to try after the ones the network sends in the PCO:
#                    addr, [addr]:port, name or name:port, separated by spaces
#   pcscf-port       port for P-CSCFs given without one (5060)
#   sip-port         our own SIP port (5060)
#   user-agent       with [PRODUCT_MODEL] [BUILD_VERSION] [OPERATOR] [DEVICE_TYPE] (from [device]);
#                    [UICC_VERSION] and [OMCCODE] take uicc-version= and operator-code=
#   sms-over-ip      true: SMS goes over IMS; false: the modem keeps SMS
#   sms-rp-ack       message (TS 24.341) or response (RP-ACK in the 200 OK body)
#   smsc             +E.164 service centre, wins over the SIM's EF_SMSP
#   ipsec            the TTA management object's IPsec_enabled: true, sec-agree with
#                    IPsec is the only way to register (R6 has no fallback)
#   ipsec-ealg       encryption offered: aes-cbc, null, or both ("aes-cbc,null")
#   ipsec-alg        integrity offered: hmac-sha-1-96, hmac-md5-96 (TTA prefers
#                    hmac-sha-2-256-128, which needs the TS 33.220 KDF: not yet)
#   pt-amr-wb pt-amr pt-dtmf-wb pt-dtmf   RTP payload types we offer
#   session-expires  Session-Expires of our INVITEs (1800)
#   rtp-port         our RTP port (40000)
#   pt-amr-wb-be pt-amr-be   bandwidth-efficient PTs offered next to the octet-aligned ones
#   tta              TTAK.KO-06.0357/R6: its Table 5-4 offers (both AMR payload
#                    formats, maxptime, b=RS/RR, o=<number>) and its session timer
#                    (refresher=uac, refreshing as the UAC)
#   country-code     home country code: +<cc>... is dialled and texted as 0...
#   sms-psi          MO-SMS Request-URI (the SC's PSI); unset: the destination number
#   reg-event        SUBSCRIBE to the reg event package (true)
#   sip-instance     +sip.instance with the IMEI URN in the REGISTER Contact (true)
#
# RCS keys (rcs-*) describe how the carrier does RCS. None of them turns it on:
# imsroha-rcs runs only with [rcs] enable=true in /etc/imsroha/imsroha.conf.
#   rcs-acs-url      the autoconfiguration server, http:// (the HTTP leg; the
#                    HTTPS leg is the same URL with https://, or rcs-acs-https-url)
#   rcs-otp-port     application port of the OTP SMS (and of -rcscfg requests)
#   rcs-otp-type     binary (the whole port SMS is the OTP) or text (rcs-otp-regex)
#   rcs-profile rcs-provisioning-version rcs-version rcs-app
#                    rcs_profile=, provisioning_version=, rcs_version= (unset: not
#                    sent) and the app= list of the HTTPS request
#   rcs-user-agent   SIP User-Agent, with [PRODUCT_MODEL] [BUILD_VERSION] [OPERATOR]
#   rcs-http-user-agent  the ACS requests' User-Agent (unset: rcs-user-agent)
#   rcs-accept-language  Accept-Language of the ACS requests
#   rcs-sip-port     SIP over TLS port when NAPTR/SRV give none
#   rcs-reg-expires  Expires of the RCS REGISTER
#   rcs-iscomposing-cpim  isComposing wrapped in CPIM (RCC.07) or bare
#   rcs-standalone   standalone (pager mode) messages may be sent
#
# The User-Agent placeholders [PRODUCT_MODEL], [BUILD_VERSION], [OPERATOR] and
# [DEVICE_TYPE] come from [device] in imsroha.conf (model=, build=, operator=,
# device-type=).
#
# Korea: everything TTAK.KO-06.0357/R6 (2026-06-26, docs/korea-tta.md) fixes is
# taken from it, for all three carriers. The rest comes from Samsung's IMS
# profile in the stock SM-F711N firmware F711NKSSFKZH5 (imsservice.apk,
# res/raw/imsprofile.json: "SKT VoLTE", "KT VoLTE", "LGU VoLTE"; the PLMNs from
# res/raw/mnomap.json), or for LG U+ from what worked on the Galaxy Z Flip3.
#
# The User-Agent is R6 5.2.1's ABNF: "TTA-VoLTE/4.0 <model>/<sw>
# Device_Type/<type> <operator>". The type is a token R6 allows beyond its list
# (device-type= in [device], Linux_Phone by default; LG U+ registers it), the
# operator the carrier that first sold the device (SKT, KT, LGU, or OMD for an
# open-market one); both are device settings, not carrier ones. R6 5.2.2 still
# says 3.0 once.
# Korean carriers check it: give model= the Korean model number.
#
# RCS (Chatting+): TTAK.KO-06.0410/R9 for the procedure, stock for the values
# (globalsettings.json SKT_KR/KT_KR/LGU+_KR: rcs_custom_config_server_url,
# rcs_otp_sms_type/port/regex, rcs_up_profile, rcs_provisioning_version,
# rcs_app_list; imsprofile.json "LGU RCS" etc.: port 9672, TLS, NAPTR, the
# User-Agent "TTA-RCS/[CLIENT_VERSION] ..." with rcs_client_version 2.4).
# R9 8.1's ABNF says TTA-RCS/1.0 and its example ACS request rcs_profile=UP_1.0,
# provisioning_version=2.0, rcs_version=6.0; stock's are used. R9 7.2.3: no CPIM
# around isComposing; table 7-1: no standalone messaging. Working on LG U+
# (2026-11-11: provisioning, registration, chat both ways); SKT and KT untried.
#
# LG U+ registers with all of it (Galaxy Z Flip3, 2026-11-11: sec-agree,
# hmac-sha-1-96 with aes-cbc; SMS and calls both ways). It answers the reg event
# SUBSCRIBE with 489 "REG EVENT OFF", after which imsroha stops, as R6 5.2.1
# says. Before that it registered the tests/lguplus-recorded.conf way. SKT and
# KT are untried.

[LG U+]
plmn=45006
domain=lte-lguplus.co.kr
# LG U+ puts no P-CSCF in the IMS PDN's PCO (flag 0, every start on the
# Flip3, 2026-11-11), and stock leaves pcscf empty (OMA-DM provisioned): this
# is the one the Flip3's modem holds in its DM store. It is what imsroha uses.
pcscf=2001:4430:4:401::43
user-agent=TTA-VoLTE/4.0 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/[DEVICE_TYPE] [OPERATOR]
sms-over-ip=true
sms-rp-ack=response
smsc=+821020921827
ipsec=true
ipsec-ealg=aes-cbc,null
ipsec-alg=hmac-sha-1-96
tta=true
pt-amr-wb=106
pt-amr=104
# Bandwidth-efficient PTs for Table 5-4; stock LG U+ has none, these are free.
pt-amr-wb-be=105
pt-amr-be=103
pt-dtmf-wb=107
pt-dtmf=101
session-expires=1800
country-code=82
rcs-acs-url=http://config.rcs.mnc006.mcc450.pub.connectrcs.com
rcs-otp-port=37273
rcs-otp-type=binary
rcs-otp-regex=your verification code for rcs messaging
rcs-profile=UP_2.4
rcs-provisioning-version=5.0
rcs-app=ap2001,ap2002,urn:oma:mo:ext-3gpp-ims:1.0
rcs-user-agent=TTA-RCS/2.4 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/RCS_Android_Phone [OPERATOR]
rcs-accept-language=ko-KR
rcs-sip-port=9672
# R9 6.4.3's example REGISTER asks for 600000.
rcs-reg-expires=600000
rcs-iscomposing-cpim=false
rcs-standalone=false

[SKT]
plmn=45005;45003
domain=sktims.net
# Stock lists these (pcscf_pref OMA-DM, so the network's PCO comes first).
# The IPv4 ones in stock (172.28.118.201, 172.28.109.141, 172.28.109.100) are
# left out: the IMS PDN is brought up IPv6 only.
pcscf=fd00:615:501:8::71 fd00:e15:501:5::141 fd00:e15:301:5::100
user-agent=TTA-VoLTE/4.0 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/[DEVICE_TYPE] [OPERATOR]
# Stock registers mmtel only: SKT SMS stays with the modem (R6 9.1: the DM
# server picks NAS or IP; the UE supports both).
sms-over-ip=false
ipsec=true
ipsec-ealg=aes-cbc,null
ipsec-alg=hmac-sha-1-96
tta=true
pt-amr-wb=100
pt-amr=98
# Stock SKT has no bandwidth-efficient PTs; these two are free in its profile.
pt-amr-wb-be=99
pt-amr-be=97
pt-dtmf-wb=103
pt-dtmf=101
session-expires=1800
country-code=82
rcs-acs-url=http://config.rcs.mnc005.mcc450.pub.connectrcs.com
rcs-otp-port=37273
rcs-otp-type=binary
rcs-otp-regex=your verification code for rcs messaging
rcs-profile=UP_2.4
rcs-provisioning-version=5.0
rcs-app=ap2001,ap2002,urn:oma:mo:ext-3gpp-ims:1.0
rcs-user-agent=TTA-RCS/2.4 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/RCS_Android_Phone [OPERATOR]
rcs-accept-language=ko-KR
rcs-sip-port=9672
# R9 6.4.3's example REGISTER asks for 600000.
rcs-reg-expires=600000
rcs-iscomposing-cpim=false
rcs-standalone=false

[KT]
plmn=45008
domain=ims.mnc008.mcc450.3gppnetwork.org
# Stock: P-CSCF from the PCO, this name as the fallback.
pcscf=volte.imskt.com
user-agent=TTA-VoLTE/4.0 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/[DEVICE_TYPE] [OPERATOR]
# Stock runs the UE's SIP client on 5080.
sip-port=5080
sms-over-ip=true
ipsec=true
ipsec-ealg=aes-cbc,null
ipsec-alg=hmac-sha-1-96
tta=true
pt-amr-wb=98
pt-amr=101
# Stock KT's bandwidth-efficient PTs (amrwbbe_payload, amrnbbe_payload).
pt-amr-wb-be=97
pt-amr-be=100
pt-dtmf-wb=99
pt-dtmf=102
session-expires=360
country-code=82
rcs-acs-url=http://config.rcs.mnc008.mcc450.pub.connectrcs.com
rcs-otp-port=37273
rcs-otp-type=binary
rcs-otp-regex=your verification code for rcs messaging
rcs-profile=UP_2.4
rcs-provisioning-version=5.0
rcs-app=ap2001,ap2002,urn:oma:mo:ext-3gpp-ims:1.0
rcs-user-agent=TTA-RCS/2.4 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/RCS_Android_Phone [OPERATOR]
rcs-accept-language=ko-KR
rcs-sip-port=9672
# R9 6.4.3's example REGISTER asks for 600000.
rcs-reg-expires=600000
rcs-iscomposing-cpim=false
rcs-standalone=false
