#
# Carrier profiles. imsroha picks the group whose plmn= list holds the SIM's
# MCC+MNC (from EF_IMSI and EF_AD). Anything here can be overridden on one
# machine in /etc/imsroha/imsroha.conf, group [carrier].
#
# Keys (all optional; a missing key keeps the 3GPP default):
#   domain           home domain when the SIM has no ISIM (an ISIM's EF_DOMAIN wins)
#   pcscf            P-CSCFs to try after the ones the network sends in the PCO:
#                    addr, [addr]:port, name or name:port, separated by spaces
#   pcscf-port       port for P-CSCFs given without one (5060)
#   sip-port         our own SIP port (5060)
#   user-agent       with [PRODUCT_MODEL] [BUILD_VERSION] [OPERATOR] (from [device]);
#                    [UICC_VERSION] and [OMCCODE] take uicc-version= and operator-code=
#   sms-over-ip      true: SMS goes over IMS; false: the modem keeps SMS
#   sms-rp-ack       message (TS 24.341) or response (RP-ACK in the 200 OK body)
#   smsc             +E.164 service centre, wins over the SIM's EF_SMSP
#   ipsec            the TTA management object's IPsec_enabled: true, sec-agree with
#                    IPsec is the only way to register (R6 has no fallback)
#   ipsec-ealg       encryption offered: aes-cbc, null, or both ("aes-cbc,null")
#   ipsec-alg        integrity offered: hmac-sha-1-96, hmac-md5-96 (TTA prefers
#                    hmac-sha-2-256-128, which needs the TS 33.220 KDF: not yet)
#   pt-amr-wb pt-amr pt-dtmf-wb pt-dtmf   RTP payload types we offer
#   session-expires  Session-Expires of our INVITEs (1800)
#   rtp-port         our RTP port (40000)
#   pt-amr-wb-be pt-amr-be   bandwidth-efficient PTs offered next to the octet-aligned ones
#   tta              TTAK.KO-06.0357/R6: its Table 5-4 offers (both AMR payload
#                    formats, maxptime, b=RS/RR, o=<number>) and its session timer
#                    (refresher=uac, refreshing as the UAC)
#   country-code     home country code: +<cc>... is dialled and texted as 0...
#   sms-psi          MO-SMS Request-URI (the SC's PSI); unset: the destination number
#   reg-event        SUBSCRIBE to the reg event package (true)
#   sip-instance     +sip.instance with the IMEI URN in the REGISTER Contact (true)
#
# The User-Agent placeholders [PRODUCT_MODEL], [BUILD_VERSION] and [OPERATOR]
# come from [device] in imsroha.conf (model=, build=, operator=).
#
# Korea: everything TTAK.KO-06.0357/R6 (2026-06-26, docs/korea-tta.md) fixes is
# taken from it, for all three carriers. The rest comes from Samsung's IMS
# profile in the stock SM-F711N firmware F711NKSSFKZH5 (imsservice.apk,
# res/raw/imsprofile.json: "SKT VoLTE", "KT VoLTE", "LGU VoLTE"; the PLMNs from
# res/raw/mnomap.json), or for LG U+ from what worked on the Galaxy Z Flip3.
#
# The User-Agent is R6 5.2.1's ABNF: "TTA-VoLTE/4.0 <model>/<sw>
# Device_Type/Android_Phone <operator>", the operator being the carrier that
# first sold the device (SKT, KT, LGU, or OMD for an open-market one), so it is
# operator= in [device], not a carrier setting. R6 5.2.2 still says 3.0 once.
# Korean carriers check it: give model= the Korean model number.
#
# LG U+ has registered (Galaxy Z Flip3, 2026-11) only the way
# tests/lguplus-recorded.conf describes: no IPsec, none of TTA's additions,
# TTA-VoLTE/1.0. Everything below is untried on all three.

[LG U+]
plmn=45006
domain=lte-lguplus.co.kr
# Stock leaves pcscf empty (OMA-DM provisioned); this is the one the Flip3's
# modem hands out from its DM store, used when the PCO has none.
pcscf=2001:4430:4:401::43
user-agent=TTA-VoLTE/4.0 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/Android_Phone [OPERATOR]
sms-over-ip=true
sms-rp-ack=response
smsc=+821020921827
ipsec=true
ipsec-ealg=aes-cbc,null
ipsec-alg=hmac-sha-1-96
tta=true
pt-amr-wb=106
pt-amr=104
# Bandwidth-efficient PTs for Table 5-4; stock LG U+ has none, these are free.
pt-amr-wb-be=105
pt-amr-be=103
pt-dtmf-wb=107
pt-dtmf=101
session-expires=1800
country-code=82

[SKT]
plmn=45005;45003
domain=sktims.net
# Stock lists these (pcscf_pref OMA-DM, so the network's PCO comes first).
# The IPv4 ones in stock (172.28.118.201, 172.28.109.141, 172.28.109.100) are
# left out: the IMS PDN is brought up IPv6 only.
pcscf=fd00:615:501:8::71 fd00:e15:501:5::141 fd00:e15:301:5::100
user-agent=TTA-VoLTE/4.0 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/Android_Phone [OPERATOR]
# Stock registers mmtel only: SKT SMS stays with the modem (R6 9.1: the DM
# server picks NAS or IP; the UE supports both).
sms-over-ip=false
ipsec=true
ipsec-ealg=aes-cbc,null
ipsec-alg=hmac-sha-1-96
tta=true
pt-amr-wb=100
pt-amr=98
# Stock SKT has no bandwidth-efficient PTs; these two are free in its profile.
pt-amr-wb-be=99
pt-amr-be=97
pt-dtmf-wb=103
pt-dtmf=101
session-expires=1800
country-code=82

[KT]
plmn=45008
domain=ims.mnc008.mcc450.3gppnetwork.org
# Stock: P-CSCF from the PCO, this name as the fallback.
pcscf=volte.imskt.com
user-agent=TTA-VoLTE/4.0 [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/Android_Phone [OPERATOR]
# Stock runs the UE's SIP client on 5080.
sip-port=5080
sms-over-ip=true
ipsec=true
ipsec-ealg=aes-cbc,null
ipsec-alg=hmac-sha-1-96
tta=true
pt-amr-wb=98
pt-amr=101
# Stock KT's bandwidth-efficient PTs (amrwbbe_payload, amrnbbe_payload).
pt-amr-wb-be=97
pt-amr-be=100
pt-dtmf-wb=99
pt-dtmf=102
session-expires=360
country-code=82
