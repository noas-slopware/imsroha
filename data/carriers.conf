#
# Carrier profiles. imsroha picks the group whose plmn= list holds the SIM's
# MCC+MNC (from EF_IMSI and EF_AD). Anything here can be overridden on one
# machine in /etc/imsroha/imsroha.conf, group [carrier].
#
# Keys (all optional; a missing key keeps the 3GPP default):
#   domain           home domain when the SIM has no ISIM (an ISIM's EF_DOMAIN wins)
#   pcscf            P-CSCFs to try after the ones the network sends in the PCO:
#                    addr, [addr]:port, name or name:port, separated by spaces
#   pcscf-port       port for P-CSCFs given without one (5060)
#   sip-port         our own SIP port (5060)
#   user-agent       with [UICC_VERSION] [PRODUCT_MODEL] [BUILD_VERSION] [OMCCODE]
#   uicc-version     [UICC_VERSION]
#   operator-code    [OMCCODE]
#   sms-over-ip      true: SMS goes over IMS; false: the modem keeps SMS
#   sms-rp-ack       message (TS 24.341) or response (RP-ACK in the 200 OK body)
#   smsc             +E.164 service centre, wins over the SIM's EF_SMSP
#   ipsec            true: sec-agree with IPsec (TS 33.203)
#   ipsec-ealg       encryption offered: null, aes-cbc, or both ("null,aes-cbc")
#   pt-amr-wb pt-amr pt-dtmf-wb pt-dtmf   RTP payload types we offer
#   session-expires  Session-Expires of our INVITEs (1800)
#   rtp-port         our RTP port (40000)
#   country-code     home country code: +<cc>... is dialled and texted as 0...
#
# Korea. Where a value is not recorded on a working phone, it comes from
# Samsung's IMS profile in the stock SM-F711N firmware F711NKSSFKZH5
# (imsservice.apk, res/raw/imsprofile.json: "SKT VoLTE", "KT VoLTE",
# "LGU VoLTE"; the PLMNs from res/raw/mnomap.json; the operator codes from
# OmcCode in the same apk). The stock User-Agent is the TTA one
# (TTAK.KO-06.0357), "TTA-VoLTE/[UICC_VERSION] [PRODUCT_MODEL]/[BUILD_VERSION]
# Device_Type/Android_Phone [OMCCODE]", with uicc_mobility_ver 3.0 from the
# profile defaults. Korean carriers check it: give [PRODUCT_MODEL] the Korean
# model number (model= in [device]).
#
# LG U+ is the only one that has registered (Galaxy Z Flip3, 2026-11). Its
# values are the ones that worked there, which differ from stock in places
# (UICC version 1.0, payload types, Session-Expires, no IPsec). SKT and KT are
# stock values that have never been tried.

[LG U+]
plmn=45006
domain=lte-lguplus.co.kr
# Stock leaves pcscf empty (OMA-DM provisioned); this is the one the Flip3's
# modem hands out from its DM store, used when the PCO has none.
pcscf=2001:4430:4:401::43
user-agent=TTA-VoLTE/[UICC_VERSION] [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/Android_Phone [OMCCODE]
uicc-version=1.0
operator-code=LUC
sms-over-ip=true
sms-rp-ack=response
smsc=+821020921827
ipsec=false
pt-amr-wb=106
pt-amr=104
pt-dtmf-wb=107
pt-dtmf=101
session-expires=1800
country-code=82

[SKT]
plmn=45005;45003
domain=sktims.net
# Stock lists these (pcscf_pref OMA-DM, so the network's PCO comes first).
# The IPv4 ones in stock (172.28.118.201, 172.28.109.141, 172.28.109.100) are
# left out: the IMS PDN is brought up IPv6 only.
pcscf=fd00:615:501:8::71 fd00:e15:501:5::141 fd00:e15:301:5::100
user-agent=TTA-VoLTE/[UICC_VERSION] [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/Android_Phone [OMCCODE]
uicc-version=3.0
operator-code=SKC
# Stock registers mmtel only: SKT SMS stays with the modem.
sms-over-ip=false
ipsec=true
ipsec-ealg=aes-cbc
pt-amr-wb=100
pt-amr=98
pt-dtmf-wb=103
pt-dtmf=101
session-expires=1800
country-code=82

[KT]
plmn=45008
domain=ims.mnc008.mcc450.3gppnetwork.org
# Stock: P-CSCF from the PCO, this name as the fallback.
pcscf=volte.imskt.com
user-agent=TTA-VoLTE/[UICC_VERSION] [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/Android_Phone [OMCCODE]
uicc-version=3.0
operator-code=KTC
# Stock runs the UE's SIP client on 5080.
sip-port=5080
sms-over-ip=true
ipsec=true
ipsec-ealg=null,aes-cbc
pt-amr-wb=98
pt-amr=101
pt-dtmf-wb=99
pt-dtmf=102
session-expires=360
country-code=82
