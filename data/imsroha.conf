# /etc/imsroha/imsroha.conf — everything is optional.
#
# Drop-ins in /usr/share/imsroha/imsroha.conf.d/*.conf (a device package's
# settings for its phone) are read first, in name order; a key set here wins.
#
# [device] describes the hardware. The defaults fit a Qualcomm SoC modem on
# QRTR node 0 whose data path ModemManager has already set up.
[device]
# The modem's QMI services: a QRTR node (SoC), or a QMI device (USB/PCIe).
#qrtr-node=0
#qmi-device=/dev/cdc-wdm0
#
# The rmnet parent of the IMS PDN. Found from its driver when unset (ipa,
# mhi_net, qmi_wwan, bam-dmux), and so are the endpoint type and number.
#data-netdev=rmnet_ipa0
#data-endpoint-type=embedded
#data-endpoint-iface=1
#
# The QMAP mux id of the IMS PDN: one ModemManager does not use for its own
# bearers. The link imsroha-bearer creates, and the profile it starts (0 =
# the 3GPP profile whose APN is apn=).
#mux-id=3
#ims-netdev=imsroha0
#profile=0
#apn=ims
#
# Policy routing for traffic from the IMS address.
#route-table=1042
#route-priority=1042
#
# The IMS link's MTU when the modem reports none for the PDN. 1428 is what
# stock LG U+ IMS profiles use; with a fixed 1400 every INVITE to an
# 11-digit number went out IPv6-fragmented, and LG U+ answered those with
# 404/503 most of the time.
#mtu-fallback=1428
#
# User-Agent placeholders. Korean carriers check the model: use the
# country's model number (SM-F711N, not SM-F711B).
#model=SM-F711N
#build=IMSroha-<version>
# TTA's operator: the carrier that first sold the device (SKT, KT, LGU), or OMD
# for an open-market one (the default).
#operator=OMD
# TTA's Device_Type in the VoLTE User-Agent: any token (R6 allows one) or
# one of Android_Phone, iPhone, Tablet_PC ...; Linux_Phone by default.
#device-type=Linux_Phone
# RCS: terminal_vendor of the autoconfiguration request (SEC for Samsung).
#vendor=SEC

# [carrier] overrides any key of the carrier profile picked from
# /usr/share/imsroha/carriers.conf (see the comments there).
[carrier]
#pcscf=2001:db8::1
#user-agent=TTA-VoLTE/[UICC_VERSION] [PRODUCT_MODEL]/[BUILD_VERSION] Device_Type/[DEVICE_TYPE] [OMCCODE]

# [rcs]: RCS (GSMA Universal Profile chat; Chatting+ in Korea), by
# imsroha-rcs. Off unless enable=true here; nothing in carriers.conf can turn
# it on. When on, it contacts the carrier's autoconfiguration server with the
# IMSI and IMEI, and the carrier may record the answer against the line.
# Turning it off again tells that server once (rcs_state=-4), as stock does.
# docs/rcs.md has the whole story.
[rcs]
#enable=false
# Sockets on this netdev (the internet PDN, e.g. ModemManager's bearer), and
# IPv4 ones on interface-ipv4 (CLAT); unset, routing decides. Never the IMS netdev.
#interface=qmapmux0.0
#interface-ipv4=clat0
# Own number for the flow off the carrier's network; unset: ModemManager's.
#msisdn=+821012345678
# client_vendor (at most 4 characters) and client_version (Platform-Major.Minor)
# of the autoconfiguration request. Stock Samsung Messages sends SEC and RCSAndr-6.0.
#client-vendor=IMSR
#client-version=RCSLinux-0.2
# default_sms_app: 1 = the RCS client is the SMS app.
#default-sms-app=1
# Start with the bare HTTP request on the carrier's network (true), or go
# straight to the MSISDN/OTP flow (false).
#assume-mobile=true
#otp-timeout=300
# Extra trust anchors for the TLS connections (tests, private networks).
#ca-file=
# Received files (file transfer over HTTP) go to <download-dir>/<IMSI>/,
# created as the owner of download-dir, so the messaging app can read them.
# Unset: <state-dir>/<IMSI>/files, which only root can read.
#download-dir=/home/user/.local/share/imsroha-rcs
# Chatbots and RCS A2P (TTAK.KO-06.0410/R9 7.7), when the ACS configuration has
# a Chatbot characteristic. false: nothing chatbot is advertised or accepted.
#chatbot=true
